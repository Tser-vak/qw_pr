name: qw_pr

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Ollama automatically supports downloading from Hugging Face!
    # We start the server in the background, wait 5 seconds, and pull the model.
    command: >
      bash -c "ollama serve & sleep 5 && ollama pull hf.co/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL && wait"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 900s  # Allow up to 15 mins for first-time 17.6GB model download

  swarm-ui:
    build:
      context: ./agent_app
    container_name: swarm-ui
    ports:
      - "8501:8501"
    environment:
      - VLLM_API_BASE=http://ollama:11434/v1
      - MODEL_NAME=hf.co/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
      - DATABASE_URL=${DATABASE_URL:-}
      - STREAMLIT_USERNAME=${STREAMLIT_USERNAME:-admin}
      - STREAMLIT_PASSWORD=${STREAMLIT_PASSWORD:-admin}
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./agent_app:/app
      - ./tests:/app/tests

volumes:
  ollama-data:
