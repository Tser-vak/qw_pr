name: qw_pr

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Ollama automatically supports downloading from Hugging Face!
    # We override the entrypoint so we can run a background script to pull the model automatically
    entrypoint: /bin/bash
    command: -c "ollama serve & sleep 5 && ollama pull hf.co/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL && wait"

  swarm-ui:
    build:
      context: ./agent_app
    container_name: swarm-ui
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_API_BASE=http://ollama:11434/v1
      - MODEL_NAME=hf.co/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
      - DATABASE_URL=${DATABASE_URL:-}
      - STREAMLIT_USERNAME=${STREAMLIT_USERNAME:-admin}
      - STREAMLIT_PASSWORD=${STREAMLIT_PASSWORD:-admin}
    depends_on:
      - ollama
    volumes:
      - ./agent_app:/app
      - ./tests:/app/tests

volumes:
  ollama-data:
